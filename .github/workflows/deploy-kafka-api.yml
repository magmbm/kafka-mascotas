name: Deploy API Kafka

on:
  push:
    branches:
      - proyecto-clon
      - main

    paths:
      - 'docker-compose.yml'
      - 'mascotas-kafka/**'

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}  
          username: ec2-user                 
          key: ${{ secrets.EC2_SSH_KEY }}    
          port: 22
          envs: TARGET_HOST_IP
          script: |
            AWS_ACCESS_KEY_ID= ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY= ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_SESSION_TOKEN= ${{ secrets.AWS_SESSION_TOKEN }}

            if ! command -v docker &> /dev/null; then
                echo "Docker no está instalado. Iniciando instalación..."
                sudo dnf update -y
                sudo dnf install -y docker
                sudo systemctl start docker
                sudo systemctl enable docker
                sudo usermod -aG docker ec2-user
            fi

            if ! command --version aws &> /dev/null; then
              curl -fsSL https://awscli.amazonaws.com/v2/install.sh | bash
            fi

            echo $(ls -la ~)
            mkdir -p ~/.aws/credentials
            #echo "[default]" > ~/.aws/credentials
            #echo "aws_access_key_id=$AWS_ACCESS_KEY_ID" >> ~/.aws/credentials
            #echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY" >> ~/.aws/credentials
            #echo "aws_session_token=$AWS_SESSION_TOKEN" >> ~/.aws/credentials

        env:
          TARGET_HOST_IP: ${{ vars.TARGET_HOST_IP }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
